<?xml version="1.0" encoding="UTF-8"?>
<!--
  Dessau — logo

  The mark as the initial of the word, with "essau" in Inter Black converted to
  outlines. A mark shaped like a D standing IN FRONT of the word "Dessau" says
  the letter twice; as the initial it says the idea once.

  (Separators are "=" because a double hyphen inside an XML comment is fatal.
  See dessau-mark.svg.)

  ===========================================================================
  Why Black, and not the Regular the rest of the site uses
  ===========================================================================

  The mark's stroke is 0.29 of its cap height. Inter's weight axis was
  instanced and measured to find what stands beside that without looking like
  an accident:

      wght 400   stroke 0.128      wght 700   stroke 0.205
      wght 500   stroke 0.153      wght 800   stroke 0.237
      wght 600   stroke 0.179      wght 900   stroke 0.271

  900 it is. The remaining 0.019 is the mark reading a shade heavier than the
  word, which is the right direction for a logo: the initial leads.

  ===========================================================================
  Spacing
  ===========================================================================

  The wordmark starts at 99.498, which is the mark's ink width (91.8) plus
  Inter Black's own right side bearing after a D (4.698) plus 3 units of optical
  correction, because this D is wider and heavier than the one Inter fits for.
  No tracking is applied inside the word: that letterfit is the typeface's.

  ===========================================================================
  Why outlines rather than live text
  ===========================================================================

  An SVG used as an image gets no fonts from the document, so a text element
  would render in Inter only on machines that already have Inter. Outlines are
  fixed. Extracted from the unsubset Inter-Variable.ttf as published by
  github.com/google/fonts — not from the subset WOFF2 this site now serves — by instancing
  the wght axis (gvar deltas, IUP for the points a tuple does not list, and the
  phantom points for the advance widths), verified by instancing at the default
  weight and diffing against the static outline.

  The viewBox is the ink box: the 101.34 of height is the cap plus the overshoot
  of the round letters below the baseline. Do not tidy it to 100; that clips
  the bottoms of e, s, a and u.

  currentColor, so it follows the theme when INLINED or used as a mask. As an
  img src it renders black, having nothing to inherit from.

  ===========================================================================
  The "DS" tag
  ===========================================================================

  Set apart from the wordmark by a rule, not glued on: unlike a domain suffix
  such as ".dev", "DS" has no reading of its own — appended flush it looks like
  the word grew two stray capitals, not like an abbreviation.

  Space Grotesk, not Inter: the opposite reasoning from the wordmark above. The
  wordmark needed a weight that matched the mark's 0.29 stroke, and Space
  Grotesk's axis tops out at 0.19 — a third too light, which is why it was
  rejected there. The tag is not trying to match the mark; it is meant to carry
  less weight than the wordmark it sits beside, so a family whose heaviest cut
  is still lighter than Inter Black is exactly what belongs here. Set at 500.

  Extracted the same way as "essau" — instancing the variable font's wght axis
  and drawing the outline — but this time from the local, subsetted
  reference/assets/fonts/SpaceGrotesk-Variable-latin-ext.woff2 rather than an
  unsubset original. That distinction mattered for Inter because the subsetter
  drops OpenType features a stylesheet didn't name (tnum, cv05, ss03 — see
  fonts.css); it doesn't matter here, because a plain capital D and S invoke
  none of them.

      cap height (Space Grotesk, wght 500)   700 of 1000 upm
      tag cap height, this file                46, 0.46 of the wordmark's 100
      scale                                    46 / 700 = 0.0657...

  Centred on the wordmark's cap band — its own cap runs from y=27 to y=73,
  around the midpoint of the 0–100 cap — not baseline-aligned to it. This is a
  tag beside the word, not a continuation of it.

  Letterfit: D and S keep their own advance widths, plus 6 units between them
  standing in for the tracking outlines cannot carry. The rule between the
  wordmark and the tag is 2 units wide, 62 tall (0.62 of the cap, also centred
  on the cap band), at 28% opacity — present without competing with either
  side of it. 16 units of gap on each side of the rule, close to half the
  mark's own stem width.

  The tag adds width only: 508.89 to 629.98. Height is unchanged at 101.34 —
  everything sits inside the existing vertical band.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 629.98 101.34" fill="currentColor"
     role="img" aria-labelledby="dessau-logo-title">
  <title id="dessau-logo-title">Dessau DS</title>

