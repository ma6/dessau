  <rect width="640" height="360" fill="#f2f2f2"/>
  <g stroke="#e5e5e5" stroke-width="1">
    <path d="M0 90h640M0 180h640M0 270h640M160 0v360M320 0v360M480 0v360"/>
  </g>
  <circle cx="240" cy="180" r="96" fill="#9a4b2c" fill-opacity="0.22"/>
  <rect x="288" y="108" width="144" height="144" fill="#4649b8" fill-opacity="0.22"/>
  <path d="M400 252 472 108l72 144z" fill="#656565" fill-opacity="0.18"/>
</svg>
