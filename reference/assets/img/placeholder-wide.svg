<?xml version="1.0" encoding="UTF-8"?>
<!--
  Reference-page placeholder. Not part of DDS.

  Deliberately abstract: three overlapping planes and a grid, drawn from the
  system's own accent and neutral values. It stands in for "an image goes here"
  without pretending to be a photograph and without any brand content.

  Colours are literal rather than tokens, because an <img> is a separate document
  and does not inherit the page's custom properties. That is the same isolation
  that makes an externally referenced icon sprite lose `currentColor`.
-->
